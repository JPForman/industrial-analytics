name: Ingestor CI

on:
  push:
    branches: [main]
    paths: ["apps/ingestor/**", "packages/sparkplug/**", "apps/api/app/**", ".github/workflows/ingestor-ci.yml"]
  pull_request:
    paths: ["apps/ingestor/**", "packages/sparkplug/**", "apps/api/app/**", ".github/workflows/ingestor-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ingestor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestor
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: industrial
          POSTGRES_PASSWORD: industrial
          POSTGRES_DB: industrial
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U industrial -d industrial"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://industrial:industrial@localhost:5432/industrial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install with monorepo siblings (compat mode so mypy sees them)
        run: |
          pip install -e "$GITHUB_WORKSPACE/packages/sparkplug" -e "$GITHUB_WORKSPACE/apps/api" --config-settings editable_mode=compat
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy ingestor tests
      - run: pytest -q
