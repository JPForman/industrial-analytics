name: Stack CI

# Builds every image and runs the whole stack end to end: simulator -> MQTT -> ingestor -> DB ->
# API -> nginx. Unit tests live in the per-app workflows; this one catches what they can't
# (Dockerfiles, compose wiring, healthcheck ordering, proxy config).
on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "deploy/**", ".dockerignore", ".github/workflows/stack-ci.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "deploy/**", ".dockerignore", ".github/workflows/stack-ci.yml"]

permissions:
  contents: read

concurrency:
  group: stack-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f deploy/docker-compose.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build images
        run: $COMPOSE build

      - name: Start the stack
        run: $COMPOSE up -d

      - name: Wait for the dashboard and API (through nginx)
        run: |
          for i in $(seq 60); do
            curl -fs localhost:8080/api/ready && exit 0
            sleep 2
          done
          echo "stack never became ready"; exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          B=localhost:8080
          # Static app served, SPA fallback works
          curl -fs $B/ | grep -q '<div id="root">'
          curl -fs $B/some/deep/link | grep -q '<div id="root">'
          # Auth through the proxy (fresh DB: sign up a viewer, then log in)
          curl -fs -X POST $B/api/auth/signup -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' > /dev/null
          TOKEN=$(curl -fs -X POST $B/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | jq -r .access_token)
          # The ingestor auto-registers the simulator's assets from DBIRTH
          for i in $(seq 30); do
            N=$(curl -fs "$B/api/assets" -H "Authorization: Bearer $TOKEN" | jq '.items | length')
            [ "$N" -ge 3 ] && break
            sleep 2
          done
          echo "assets: $N"; [ "$N" -ge 3 ]
          # ...and readings are flowing into TimescaleDB
          sleep 5
          ROWS=$($COMPOSE exec -T db psql -U industrial -d industrial -tAc 'select count(*) from readings')
          echo "readings: $ROWS"; [ "$ROWS" -gt 0 ]

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
