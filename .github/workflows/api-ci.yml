name: API CI

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: industrial
          POSTGRES_PASSWORD: industrial
          POSTGRES_DB: industrial
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U industrial -d industrial"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-secret-not-for-production-0123456789
      DATABASE_URL: postgresql+asyncpg://industrial:industrial@localhost:5432/industrial
      TEST_DATABASE_URL: postgresql+asyncpg://industrial:industrial@localhost:5432/industrial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests migrations
      - name: Migrations apply to an empty database
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -q
