// Subset of the Eclipse Sparkplug B payload schema (sparkplug_b.proto, Sparkplug 3.0).
// Field numbers and DataType values match the official spec so payloads interoperate;
// DataSet, Template, PropertySet and metadata messages are omitted (unused here).
syntax = "proto2";

package org.eclipse.tahu.protobuf;

enum DataType {
  Unknown = 0;
  Int8 = 1;
  Int16 = 2;
  Int32 = 3;
  Int64 = 4;
  UInt8 = 5;
  UInt16 = 6;
  UInt32 = 7;
  UInt64 = 8;
  Float = 9;
  Double = 10;
  Boolean = 11;
  String = 12;
  DateTime = 13;
  Text = 14;
}

message Payload {
  message Metric {
    optional string name = 1;
    optional uint64 alias = 2;
    optional uint64 timestamp = 3;   // ms since epoch, UTC
    optional uint32 datatype = 4;    // a DataType value
    optional bool is_historical = 5;
    optional bool is_transient = 6;
    optional bool is_null = 7;
    oneof value {
      uint32 int_value = 10;
      uint64 long_value = 11;
      float float_value = 12;
      double double_value = 13;
      bool boolean_value = 14;
      string string_value = 15;
      bytes bytes_value = 16;
    }
  }
  optional uint64 timestamp = 1;     // ms since epoch, UTC
  repeated Metric metrics = 2;
  optional uint64 seq = 3;           // 0-255, wraps; NDEATH carries no seq
  optional string uuid = 4;
  optional bytes body = 5;
}
