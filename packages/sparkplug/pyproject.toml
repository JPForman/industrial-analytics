[project]
name = "sparkplug"
version = "0.1.0"
description = "Minimal Sparkplug B helpers shared by the simulator and ingestor"
requires-python = ">=3.14"
dependencies = ["protobuf>=7.35.1"]  # must be >= the version that generated sparkplug_b_pb2.py

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sparkplug*"]

[tool.setuptools.package-data]
sparkplug = ["*.proto", "*.pyi", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["sparkplug/sparkplug_b_pb2.py", "sparkplug/sparkplug_b_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
exclude = ["sparkplug_b_pb2\\.py$"]

[[tool.mypy.overrides]]
module = ["sparkplug.sparkplug_b_pb2"]
ignore_errors = true
