[project]
name = "industrial-simulator"
version = "0.1.0"
description = "Simulated shop-floor machines publishing Sparkplug B over MQTT"
requires-python = ">=3.14"
# `sparkplug` is the monorepo package in packages/sparkplug (installed alongside, see README/CLAUDE.md)
dependencies = ["aiomqtt>=2.3", "sparkplug"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
industrial-simulator = "simulator.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
